<!DOCTYPE html>
<head>
    <title>ATM SIMULATOR</title>
</head>
<body>
    <h2>ATM SIMULATOR</h2>
<form method="POST">
    <div class="cyber">
     <p>Choose and Option to proceed</p>   
     <p>1.Balance</p>
     <p>2.Deposit</p>
     <p>3.Withdraw</p>
     <div class="div2">
     <input type="text" name="choice" placeholder="Enter your choice">
     <button type="submit">submit</button>
     </div>
     <div>
     <input type="text" name="amount" placeholder="Enter amount">
    <button type="submit">Submit</button>
     </div>
    <p>{{output}}</p>
    </div>
</form>
</body>

<style>
body{
    text-align: center;
    font-size: 20px;

}
.cyber{
    background: #111827;
    color: #00ffcc;
    border: 2px solid #00ffcc;
    border-radius: 15px;
    box-shadow:
        0 0 20px #00ffcc,
        inset 0 0 20px rgba(0,255,204,0.3);
    padding: 20px;
    margin: 30px;
    margin-left: 400px;
    margin-right: 400px;
}
.glass{
    background:rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    border-radius: 20px;
    padding: 20px;
    margin: 30px;
    margin-left: 400px;
    margin-right: 400px;

}
.div2{
    padding: 10px;
    margin: 30px;
}
.div3{
    background-color:cadetblue;
    padding: 10px;
    margin: 30px;
}
button{
    background-color: blueviolet;
    border-radius: 10px;
    font-size: 20px;

}
input{
    font-size: 20px;
    border-radius: 10px;

}
</style>
</html>
